clusterName: ""
nodeRoleName: ""
ebsKmsKeyArn: ""
amiAlias: al2023@latest

nodeClass:
  rootVolumeSize: 50Gi
  rootVolumeType: gp3

nodePools:
  system:
    cpuLimit: "16"
    weight: 100
  general:
    cpuLimit: "32"
    weight: 50
  spot:
    cpuLimit: "32"
    weight: 25

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 5m
  expireAfter: 720h
