image:
  registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com

config:
  awsRegion: us-east-1

observability:
  tracing:
    environment: production

services:
  frontend:
    autoscaling:
      minReplicas: 3
      maxReplicas: 10
    disruptionBudget:
      minAvailable: 2
  api:
    autoscaling:
      minReplicas: 3
      maxReplicas: 20
    disruptionBudget:
      minAvailable: 2
  worker:
    autoscaling:
      minReplicas: 3
      maxReplicas: 20
    disruptionBudget:
      minAvailable: 2
