{{- range $serviceName, $service := .Values.services }}
{{- if and $service.enabled $service.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.serviceName" (dict "root" $ "serviceName" $serviceName) }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
    {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
