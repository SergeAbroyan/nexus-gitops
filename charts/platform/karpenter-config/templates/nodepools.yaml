{{- $root := . -}}
{{- range $poolName, $pool := .Values.nodePools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $poolName }}
spec:
  weight: {{ $pool.weight }}
  template:
    metadata:
      labels:
        role: {{ $poolName }}
        {{- if eq $poolName "spot" }}
        nexus.io/capacity: spot
        {{- end }}
    spec:
      {{- if eq $poolName "spot" }}
      taints:
        - key: nexus.io/capacity
          value: spot
          effect: NoSchedule
      {{- end }}
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nexus
      expireAfter: {{ $root.Values.disruption.expireAfter }}
      terminationGracePeriod: 1h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - {{ if eq $poolName "spot" }}spot{{ else }}on-demand{{ end }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
            - "4"
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - medium
            - large
            - xlarge
  limits:
    cpu: {{ required (printf "nodePools.%s.cpuLimit is required" $poolName) $pool.cpuLimit | quote }}
  disruption:
    consolidationPolicy: {{ $root.Values.disruption.consolidationPolicy }}
    consolidateAfter: {{ required "disruption.consolidateAfter is required" $root.Values.disruption.consolidateAfter }}
    budgets:
      - nodes: "10%"
{{- end }}
