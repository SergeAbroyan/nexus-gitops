amiAlias: al2023@latest

nodeClass:
  rootVolumeSize: 50Gi
  rootVolumeType: gp3

nodePools:
  system:
    weight: 100
    capacityTypes:
      - on-demand
  general:
    weight: 50
    capacityTypes:
      - on-demand
  spot:
    weight: 25
    capacityTypes:
      - spot

disruption:
  consolidationPolicy: WhenEmptyOrUnderutilized
  expireAfter: 720h
