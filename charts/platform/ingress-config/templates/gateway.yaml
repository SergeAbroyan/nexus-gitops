apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  selector:
    {{- toYaml (required "gateway.selector is required" .Values.gateway.selector) | nindent 4 }}
  servers:
    - port:
        number: {{ required "gateway.port is required" .Values.gateway.port }}
        name: http
        protocol: HTTP
      hosts:
        - {{ required "host is required" .Values.host | quote }}
