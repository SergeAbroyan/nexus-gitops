apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  selector:
    {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.host | quote }}
      tls:
        httpsRedirect: true
    - port:
        number: 8443
        name: https-terminated
        protocol: HTTP
      hosts:
        - {{ .Values.host | quote }}
