apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nexus
spec:
  hosts:
    - {{ .Values.host | quote }}
  gateways:
    - {{ .Values.gateway.name }}
  http:
    - name: internal-endpoints
      match:
        - uri:
            exact: /metrics
        - uri:
            exact: /healthz
        - uri:
            exact: /readyz
      directResponse:
        status: 404
        body:
          string: Not found
    - name: application
      route:
        - destination:
            host: {{ printf "%s.%s.svc.cluster.local" .Values.nexus.apiService .Values.nexus.namespace }}
            port:
              number: {{ .Values.nexus.servicePort }}
