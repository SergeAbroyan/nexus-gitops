apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "storageClassName is required" .Values.storageClassName }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: {{ required "kmsKeyArn is required" .Values.kmsKeyArn | quote }}
reclaimPolicy: {{ required "reclaimPolicy is required" .Values.reclaimPolicy }}
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
