apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-nexus-images
spec:
  validationActions:
    - Deny
  validationConfigurations:
    required: true
    mutateDigest: false
    verifyDigest: false
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 20
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml .Values.imageVerification.namespaces | nindent 12 }}
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    {{- range .Values.imageVerification.images }}
    - glob: {{ . | quote }}
    {{- end }}
  credentials:
    providers:
      - amazon
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: {{ .Values.imageVerification.issuer | quote }}
              subject: {{ required "imageVerification.subject is required" .Values.imageVerification.subject | quote }}
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(count, count > 0)
      message: >-
        Nexus images must be signed by the nexus-applications CI workflow on main.
