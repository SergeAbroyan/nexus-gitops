image:
  repository: nexus/worker

serviceAccount:
  create: true
  automountServiceAccountToken: false
port: 8080
volumes:
  - name: temporary-files
    emptyDir: {}
volumeMounts:
  - name: temporary-files
    mountPath: /tmp

probes:
  startup:
    httpGet:
      path: /livez
      port: http
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    httpGet:
      path: /livez
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector:
  role: spot
tolerations:
  - key: nexus.io/capacity
    operator: Equal
    value: spot
    effect: NoSchedule
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  enabled: false
autoscaling:
  enabled: true
  cpuUtilization: 70
  memoryUtilization: 80
disruptionBudget:
  enabled: true

observability:
  enabled: true
  tracing:
    enabled: true
  profiling:
    enabled: true
