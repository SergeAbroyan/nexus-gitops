nameOverride: ""

image:
  repository: nexus/worker

replicaCount: 2
serviceAccount:
  create: true
  name: worker
  automountServiceAccountToken: false
command: []
port: 8080
env: []
nodeSelector:
  role: spot
tolerations:
  - key: nexus.io/capacity
    operator: Equal
    value: spot
    effect: NoSchedule
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  enabled: false
  type: ClusterIP
  port: 80
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80
disruptionBudget:
  enabled: true
  minAvailable: 1

config:
  awsRegion: ""
  sqs:
    queueURL: ""
    waitTimeSeconds: "20"
    visibilityTimeoutSeconds: "60"

