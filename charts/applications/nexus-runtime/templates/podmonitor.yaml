{{- if .Values.observability.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nexus
  labels:
    {{- include "nexus-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus
  podMetricsEndpoints:
    - targetPort: 15020
      path: /stats/prometheus
      interval: {{ .Values.observability.scrapeInterval }}
{{- end }}
