nameOverride: ""

image:
  repository: nexus/api

replicaCount: 2
serviceAccount:
  create: true
  name: api
  automountServiceAccountToken: false
command: []
port: 8080
env: []
volumes: []
volumeMounts: []

probes:
  startup:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector:
  role: general
tolerations: []
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
  port: 80
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80
disruptionBudget:
  enabled: true
  minAvailable: 1

observability:
  enabled: true
  tracing:
    enabled: true

config:
  awsRegion: ""
  database:
    host: ""
    port: "5432"
    name: nexus
    user: nexus
    sslMode: require
    secretName: nexus-database
    passwordKey: password
  valkey:
    host: ""
    port: "6379"
    username: ""
    cacheName: ""
    iamAuthentication: true
    tls: true
    cacheTTL: 30s
  sqs:
    queueURL: ""

externalSecret:
  enabled: false
  storeName: aws-secrets-manager
  refreshInterval: 1h
  remoteSecretKey: ""
  region: ""
  passwordProperty: password
