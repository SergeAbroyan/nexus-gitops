image:
  repository: nexus/api

serviceAccount:
  create: true
  automountServiceAccountToken: false
port: 8080

probes:
  startup:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector:
  role: general
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
  port: 80
autoscaling:
  enabled: true
  cpuUtilization: 70
  memoryUtilization: 80
disruptionBudget:
  enabled: true

observability:
  enabled: true
  tracing:
    enabled: true

config:
  database:
    sslMode: require
    secretName: nexus-database
    passwordKey: password
  valkey:
    iamAuthentication: true
    tls: true
    cacheTTL: 30s

externalSecret:
  storeName: aws-secrets-manager
  refreshInterval: 1h
  passwordProperty: password
