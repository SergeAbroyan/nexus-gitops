{{- $secret := .Values.externalSecret -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $secret.storeName }}
  labels:
    {{- include "nexus-base.labels" (dict "root" . "name" .Chart.Name "partOf" "nexus" "component" "api") | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecret.region is required" $secret.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-database
  labels:
    {{- include "nexus-base.labels" (dict "root" . "name" .Chart.Name "partOf" "nexus" "component" "api") | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval }}
  secretStoreRef:
    name: {{ $secret.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.config.database.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.config.database.passwordKey }}
      remoteRef:
        key: {{ required "externalSecret.remoteSecretKey is required" $secret.remoteSecretKey | quote }}
        property: {{ $secret.passwordProperty }}
