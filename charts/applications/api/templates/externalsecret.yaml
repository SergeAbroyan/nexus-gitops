{{- if .Values.externalSecret.enabled }}
{{- $name := default .Chart.Name .Values.nameOverride -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.storeName }}
  labels:
    {{- include "nexus-base.labels" (dict "root" . "name" $name "partOf" "nexus" "component" "api") | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ default .Values.config.awsRegion .Values.externalSecret.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-database
  labels:
    {{- include "nexus-base.labels" (dict "root" . "name" $name "partOf" "nexus" "component" "api") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.config.database.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.config.database.passwordKey }}
      remoteRef:
        key: {{ required "externalSecret.remoteSecretKey is required when External Secrets is enabled" .Values.externalSecret.remoteSecretKey | quote }}
        property: {{ .Values.externalSecret.passwordProperty }}
{{- end }}

