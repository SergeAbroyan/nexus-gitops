{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.serviceName" (dict "root" $ "serviceName" $serviceName) }}
  labels:
    {{- include "nexus.labels" $ | nindent 4 }}
    {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 4 }}
spec:
  {{- if not $service.autoscaling.enabled }}
  replicas: {{ $service.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: {{ $.Values.observability.enabled | quote }}
        prometheus.io/path: /metrics
        prometheus.io/port: {{ $service.port | quote }}
      labels:
        {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 8 }}
    spec:
      serviceAccountName: {{ $service.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "nexus.selectorLabels" (dict "root" $ "serviceName" $serviceName) | nindent 14 }}
      containers:
        - name: {{ $serviceName }}
          image: {{ include "nexus.image" (dict "root" $ "service" $service) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $service.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          {{- if or (eq $serviceName "api") (eq $serviceName "worker") }}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" $ }}-{{ $serviceName }}
          {{- end }}
          {{- if or $.Values.observability.tracing.enabled (eq $serviceName "frontend") (eq $serviceName "api") $service.env }}
          env:
            {{- if $.Values.observability.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "observability.tracing.endpoint is required when tracing is enabled" $.Values.observability.tracing.endpoint | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ required "observability.tracing.sampleRatio is required when tracing is enabled" $.Values.observability.tracing.sampleRatio | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment.name=%s" $.Values.observability.tracing.environment | quote }}
            {{- end }}
            {{- if eq $serviceName "frontend" }}
            - name: API_URL
              value: {{ default (printf "http://%s" (include "nexus.serviceName" (dict "root" $ "serviceName" "api"))) $.Values.config.frontend.apiURL | quote }}
            {{- else if eq $serviceName "api" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.config.database.secretName }}
                  key: {{ $.Values.config.database.passwordKey }}
            {{- end }}
            {{- with $service.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $service.resources | nindent 12 }}
{{- end }}
{{- end }}
