{{- if .Values.observability.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}-dashboard
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- range $path, $content := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- tpl ($content | toString) $ | nindent 4 }}
  {{- end }}
{{- end }}
