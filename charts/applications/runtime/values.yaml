mesh:
  enabled: true
  mtlsMode: STRICT

observability:
  enabled: true
  dashboard:
    enabled: true
  scrapeInterval: 30s
  targetDownFor: 5m

probe:
  interval: 60s
  downFor: 5m
  certificateExpiryWarningDays: 14

slo:
  availability:
    objective: 99.5
  latency:
    objective: 99
    thresholdMilliseconds: 500

