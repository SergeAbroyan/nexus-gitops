{{- if .Values.observability.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nexus
  labels:
    {{- include "nexus-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus
  podMetricsEndpoints:
    - port: http
      path: /stats/prometheus
      interval: {{ .Values.observability.scrapeInterval }}
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_ip
          targetLabel: __address__
          replacement: "$1:15020"
{{- end }}
