apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudbeaver.name" . }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloudbeaver.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cloudbeaver.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 8978
        runAsGroup: 8978
        fsGroup: 8978
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudbeaver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /opt/cloudbeaver/workspace
            - name: temporary-files
              mountPath: /tmp
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "cloudbeaver.name" . }}-workspace
        - name: temporary-files
          emptyDir: {}
