name: Validate GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.0

      - name: Lint every chart
        run: make lint-all

      - name: Render manifests for validation
        run: make render-all

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: >-
            -kubernetes-version 1.35.0
            -strict
            -summary
            -ignore-missing-schemas
            .rendered

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.19.1

      - name: Enforce workload security policies
        run: |
          for manifest in .rendered/*.yaml; do
            kyverno apply policies --resource "${manifest}" --warnings-as-errors
          done
