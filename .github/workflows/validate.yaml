name: Validate GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.22.0

      - name: Lint every chart
        run: make lint-all

      - name: Render manifests for validation
        run: make render-all

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
        with:
          args: >-
            -kubernetes-version 1.35.0
            -strict
            -summary
            -ignore-missing-schemas
            .rendered

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289
        with:
          release: v1.19.1

      - name: Enforce workload security policies
        run: |
          for manifest in .rendered/*.yaml; do
            kyverno apply policies --resource "${manifest}" --warnings-as-errors
          done
