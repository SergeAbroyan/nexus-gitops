name: Validate GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.22.0

      - name: Build chart dependencies
        run: |
          set -euo pipefail
          for chart in charts/*/*/; do
            if [[ -f "${chart}Chart.lock" ]]; then
              helm dependency build --skip-refresh "${chart}"
            fi
          done

      - name: Lint the library chart
        run: helm lint charts/base

      - name: Lint and render application charts
        run: |
          set -euo pipefail
          mkdir -p .rendered
          for chart in charts/applications/*/; do
            component="$(basename "${chart}")"
            for environment_directory in environments/*/; do
              environment="$(basename "${environment_directory}")"
              values=(--values environments/global-values.yaml --values "${environment_directory}${component}-values.yaml")
              helm lint "${chart}" "${values[@]}"
              helm template "nexus-${component}" "${chart}" --namespace nexus "${values[@]}" > ".rendered/${component}-${environment}.yaml"
            done
          done

      - name: Lint and render platform charts
        run: |
          set -euo pipefail
          for chart in charts/platform/*/; do
            name="$(basename "${chart}")"
            case "${name}" in
              cloudbeaver) release=cloudbeaver namespace=cloudbeaver ;;
              ingress) release=ingress-config namespace=istio-ingress ;;
              karpenter) release=karpenter-config namespace=kube-system ;;
              storage) release=storage-config namespace=kube-system ;;
              *) echo "Add ${name} to this list with its Argo CD release name and namespace." >&2; exit 1 ;;
            esac
            values="${chart}values.yaml"
            if [[ -f "${chart}ci-values.yaml" ]]; then
              values="${chart}ci-values.yaml"
            fi
            helm lint "${chart}" --values "${values}"
            helm template "${release}" "${chart}" --namespace "${namespace}" --values "${values}" > ".rendered/${name}.yaml"
          done

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
        with:
          args: >-
            -kubernetes-version 1.35.0
            -strict
            -summary
            -ignore-missing-schemas
            .rendered

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289
        with:
          release: v1.19.1

      - name: Enforce workload security policies
        run: |
          for manifest in .rendered/*.yaml; do
            kyverno apply policies --resource "${manifest}" --warnings-as-errors
          done
