name: Validate GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.0

      - name: Lint every chart
        run: make lint-all

      - name: Render every environment and platform chart
        run: make template-all
