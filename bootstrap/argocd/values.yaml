global:
  domain: argocd.nexus.local

configs:
  params:
    server.insecure: true
  cm:
    admin.enabled: true
    application.resourceTrackingMethod: annotation

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

applicationSet:
  replicas: 1

dex:
  enabled: false

notifications:
  enabled: false
