project: nexus-platform

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  retry:
    limit: 10
    backoff:
      duration: 30s
      factor: 2
      maxDuration: 5m

storageClassName: nexus-gp3

ingressGateway:
  name: nexus-ingress
  selector:
    istio: ingress

tracing:
  port: 4317
  samplingPercentage: 1

alerting:
  slack:
    enabled: false
    channel: "#nexus-alerts"

addons:
  istio-base:
    wave: 1
    namespace: istio-system
    repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    version: 1.30.7
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jsonPointers:
          - /webhooks/0/failurePolicy
  istio-cni:
    wave: 2
    namespace: istio-system
    repoURL: https://blob.istio.io/istio-release/charts
    chart: cni
    version: 1.30.7
  istiod:
    wave: 2
    namespace: istio-system
    repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    version: 1.30.7
  istio-ingress:
    wave: 4
    namespace: istio-ingress
    repoURL: https://blob.istio.io/istio-release/charts
    chart: gateway
    version: 1.30.7
  karpenter-crd:
    wave: 1
    repoURL: public.ecr.aws/karpenter
    chart: karpenter-crd
    version: 1.15.1
  karpenter:
    wave: 2
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    version: 1.15.1
  aws-load-balancer-controller:
    wave: 1
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    version: 3.6.2
  kyverno:
    wave: 2
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    version: 3.9.2
  argo-rollouts:
    wave: 2
    namespace: argo-rollouts
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    version: 2.43.8
  external-secrets:
    wave: 2
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    version: 2.14.0
  metrics-server:
    wave: 2
    namespace: kube-system
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    version: 3.14.0
  prometheus-operator-crds:
    wave: 1
    namespace: monitoring
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    version: 32.0.2
  monitoring:
    wave: 4
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 92.14.0
  loki:
    wave: 4
    namespace: monitoring
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: loki
    version: 20.0.1
  tempo:
    wave: 4
    namespace: monitoring
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: tempo
    version: 3.2.1
  otel-traces:
    wave: 4
    namespace: monitoring
    repoURL: ghcr.io/open-telemetry/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.177.0
  otel-logs:
    wave: 4
    namespace: monitoring
    repoURL: ghcr.io/open-telemetry/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.177.0
  sloth:
    wave: 3
    namespace: monitoring
    repoURL: https://slok.github.io/sloth
    chart: sloth
    version: 0.16.0
  pyroscope:
    wave: 4
    namespace: monitoring
    repoURL: https://grafana.github.io/helm-charts
    chart: pyroscope
    version: 2.4.2
  opencost:
    wave: 4
    namespace: opencost
    repoURL: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    version: 2.5.33

platform:
  karpenter-config:
    wave: 3
    namespace: kube-system
  storage-config:
    wave: 3
    namespace: kube-system
  policies:
    wave: 3
    namespace: kube-system
  ingress-config:
    wave: 4
  cloudbeaver:
    wave: 4
    namespace: cloudbeaver

applications:
  runtime:
    wave: 4
  api:
    wave: 4
    ignoreDifferences:
      - group: networking.istio.io
        kind: VirtualService
        jqPathExpressions:
          - .spec.http[].route[].weight
      - group: ""
        kind: Service
        jqPathExpressions:
          - .spec.selector["rollouts-pod-template-hash"]
  worker:
    wave: 4
