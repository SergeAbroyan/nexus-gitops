apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus-platform
  source:
    repoURL: {{ .Values.git.repository }}
    targetRevision: {{ .Values.git.revision }}
    path: charts/platform/karpenter
    helm:
      releaseName: nexus-karpenter-config
      valuesObject:
        clusterName: {{ required "platform.clusterName is required" .Values.platform.clusterName }}
        nodeRoleName: {{ required "platform.karpenterNodeIamRoleName is required" .Values.platform.karpenterNodeIamRoleName }}
        ebsKmsKeyArn: {{ required "platform.ebsKmsKeyArn is required" .Values.platform.ebsKmsKeyArn }}
  destination:
    server: {{ .Values.destination.server }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
