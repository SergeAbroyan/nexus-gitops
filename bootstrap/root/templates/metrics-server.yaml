apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus-platform
  source:
    repoURL: {{ .Values.metricsServer.chartRepository }}
    chart: metrics-server
    targetRevision: {{ .Values.metricsServer.chartVersion | quote }}
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 1
        nodeSelector:
          role: system
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: {{ .Values.destination.server }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
