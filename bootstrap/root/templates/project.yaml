apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nexus-platform
  namespace: argocd
spec:
  description: Nexus platform controllers and applications
  sourceRepos:
    - {{ .Values.git.repository }}
    - {{ .Values.externalSecrets.chartRepository }}
    - {{ .Values.metricsServer.chartRepository }}
    - {{ .Values.awsLoadBalancerController.chartRepository }}
    - {{ .Values.karpenter.chartRepository }}
    - {{ .Values.istio.chartRepository }}
  destinations:
    - server: {{ .Values.destination.server }}
      namespace: external-secrets
    - server: {{ .Values.destination.server }}
      namespace: nexus
    - server: {{ .Values.destination.server }}
      namespace: kube-system
    - server: {{ .Values.destination.server }}
      namespace: istio-system
    - server: {{ .Values.destination.server }}
      namespace: cloudbeaver
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
