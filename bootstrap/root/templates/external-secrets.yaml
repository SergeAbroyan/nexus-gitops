apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus-platform
  source:
    repoURL: {{ .Values.externalSecrets.chartRepository }}
    chart: external-secrets
    targetRevision: {{ .Values.externalSecrets.chartVersion | quote }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: {{ .Values.externalSecrets.serviceAccountName }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.externalSecrets.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
