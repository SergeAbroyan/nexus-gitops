  revision: main

destination:
  server: https://kubernetes.default.svc

platform:
  clusterName: ""
  awsRegion: ""
  vpcId: ""
  karpenterInterruptionQueueName: ""
  karpenterNodeIamRoleName: ""

externalSecrets:
