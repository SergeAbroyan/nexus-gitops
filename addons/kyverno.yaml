crds:
  migration:
    enabled: false

admissionController:
  replicas: 1
  nodeSelector:
    role: system
  container:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

backgroundController:
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

cleanupController:
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

reportsController:
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
