opencost:
  nodeSelector:
    role: general
  exporter:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    internal:
      enabled: true
      serviceName: monitoring-prometheus
      namespaceName: monitoring
      port: 9090
  metrics:
    serviceMonitor:
      enabled: true
  ui:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
