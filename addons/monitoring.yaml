fullnameOverride: monitoring

crds:
  enabled: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

prometheusOperator:
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  additionalServiceMonitors:
    - name: argocd
      namespaceSelector:
        matchNames:
          - argocd
      selector:
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
              - argocd-metrics
              - argocd-server-metrics
              - argocd-repo-server-metrics
      endpoints:
        - port: http-metrics
          interval: 30s
  prometheusSpec:
    retention: 7d
    retentionSize: 16GB
    nodeSelector:
      role: general
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  serviceAccount:
    create: true
  config:
    global:
      resolve_timeout: 5m
  alertmanagerSpec:
    nodeSelector:
      role: general
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  serviceAccount:
    create: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  nodeSelector:
    role: general
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: false
  persistence:
    enabled: true
    type: sts
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

extraManifests:
  aws-secrets-manager:
    apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata:
      name: aws-secrets-manager
    spec:
      provider:
        aws:
          service: SecretsManager
  grafana-admin:
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-admin
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: aws-secrets-manager
        kind: SecretStore
      target:
        name: grafana-admin
        creationPolicy: Owner
        template:
          type: Opaque
          data:
            admin-user: admin
            admin-password: "{{ `{{ .adminPassword }}` }}"

additionalPrometheusRulesMap:
  argocd:
    groups:
      - name: argocd
        rules:
          - alert: ArgoCDApplicationDegraded
            expr: max by (name, project) (argocd_app_info{health_status="Degraded"}) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Argo CD application {{ $labels.name }} has been degraded for 15 minutes.
              runbook_url: https://github.com/SergeAbroyan/nexus-gitops/blob/main/docs/runbooks/platform-alerts.md#argocdapplicationdegraded
          - alert: ArgoCDApplicationOutOfSync
            expr: max by (name, project) (argocd_app_info{sync_status="OutOfSync"}) == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Argo CD application {{ $labels.name }} has been out of sync for 30 minutes.
              runbook_url: https://github.com/SergeAbroyan/nexus-gitops/blob/main/docs/runbooks/platform-alerts.md#argocdapplicationoutofsync
          - alert: ArgoCDSyncFailed
            expr: sum by (name, project) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m])) > 0
            labels:
              severity: warning
            annotations:
              summary: Argo CD failed to sync application {{ $labels.name }}.
              runbook_url: https://github.com/SergeAbroyan/nexus-gitops/blob/main/docs/runbooks/platform-alerts.md#argocdsyncfailed
