repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        exclude: ^(bootstrap|charts/.+)/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: bash -c 'helm lint --quiet charts/base && helm lint --quiet bootstrap --namespace argocd --values bootstrap/ci-values.yaml --set cluster.environment=dev'
        language: system
        files: ^(bootstrap|charts)/
        pass_filenames: false
